name: Weekly review
description: Lightweight evidence-backed weekly engineering review and exception closure
title: "WEEK-___ — YYYY-MM-DD"
body:
  - type: textarea
    id: completed
    attributes:
      label: Engineering completed / evidence produced
    validations:
      required: true
  - type: textarea
    id: exceptions
    attributes:
      label: AI/MCP audit exceptions
      description: Include only unresolved exceptions from WEEKLY_AUDIT.md.
  - type: textarea
    id: failures
    attributes:
      label: Failures / blockers / assumptions changed
  - type: textarea
    id: schedule_cost
    attributes:
      label: Schedule / cost variance requiring attention
  - type: textarea
    id: decisions
    attributes:
      label: Decisions / changes / approvals required
  - type: textarea
    id: next
    attributes:
      label: Next authorised engineering work
    validations:
      required: true
