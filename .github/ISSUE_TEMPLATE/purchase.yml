name: Purchase
description: Record a technically justified project purchase or commitment
title: "PUR-___ — "
body:
  - type: input
    id: date
    attributes:
      label: Date
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: item
    attributes:
      label: Item / specification / quantity
    validations:
      required: true
  - type: textarea
    id: basis
    attributes:
      label: Engineering purpose / related requirement, task or calculation
      description: Link the REQ/MECH/ELEC/etc. record that justifies the purchase.
    validations:
      required: true
  - type: textarea
    id: supplier
    attributes:
      label: Supplier / quotation / alternatives considered
  - type: input
    id: unit_cost
    attributes:
      label: Unit cost (EGP)
  - type: input
    id: quantity
    attributes:
      label: Quantity
  - type: dropdown
    id: purchase_type
    attributes:
      label: Purchase type
      options: [First purchase, Replacement, Rework/corrective, Consumable, Other]
    validations:
      required: true
  - type: input
    id: related_failure
    attributes:
      label: Related FAIL ID, if replacement/rework
  - type: textarea
    id: approval
    attributes:
      label: Approval / budget impact
      description: Purchase commitments require explicit human approval.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Quotation / invoice / receipt evidence
      description: Link EVD ID and repository/Drive location when available.
