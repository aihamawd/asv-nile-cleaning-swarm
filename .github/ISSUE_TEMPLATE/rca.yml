name: Root-cause analysis
description: Investigate a failure and establish an evidence-backed root cause
title: "RCA-___ — "
body:
  - type: input
    id: failure
    attributes:
      label: Related FAIL ID / issue
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence reviewed
    validations:
      required: true
  - type: textarea
    id: hypotheses
    attributes:
      label: Competing hypotheses and elimination evidence
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: Established root cause / confidence / remaining uncertainty
    validations:
      required: true
  - type: textarea
    id: corrective
    attributes:
      label: Corrective action / related CHG
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Required retest / verification plan
    validations:
      required: true
