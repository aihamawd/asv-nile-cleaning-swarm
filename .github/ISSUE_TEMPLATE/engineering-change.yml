name: Engineering change
about: Control a material engineering change after baseline/design freeze
title: "CHG-___ — "
body:
  - type: textarea
    id: change
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Trigger / evidence / reason
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact on requirements, interfaces, mass, power, cost, schedule and safety
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Re-verification required
